title: Pea Pasta
category: Main
time: 25 min
servings: 2
tags: [one-pan]
ingredients:
  - "2 Tbs: Olive oil"
  - "1/2 cup: Chopped Onion"
  - "170g: Pasta"
  - "2 cups: peas"
  - "4 cups: water"
steps:
  - Saute onion in olive oil until translucent
  - Add water and peas, bring to a boil
  - Blend a portion of the peas to make the base creamy
  - Add pasta and cook until water is absorbed and thickens
  - Drizzle some olive oil on top and serve
note: Frozen peas work best, but canned peas are fine
