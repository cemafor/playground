<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Recipe Box</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/js-yaml/4.1.0/js-yaml.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper: #EFE7D8;
    --paper-card: #FAF6EC;
    --ink: #2A241C;
    --ink-soft: #5B5344;
    --line: #D8CBB0;
    --sage: #6E7F5C;
    --rust: #AD4E2A;
    --mustard: #C79233;
    --plum: #6B4157;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    font-feature-settings: 'tnum' 1;
  }

  h1, h2, h3, .display {
    font-family: 'Fraunces', serif;
    font-weight: 500;
    letter-spacing: -0.01em;
    margin: 0;
  }

  button, input {
    font-family: inherit;
  }

  /* ---------- layout shell ---------- */
  .shell {
    max-width: 1180px;
    margin: 0 auto;
    padding: 28px 24px 80px;
  }

  header.top {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 24px;
    border-bottom: 2px solid var(--ink);
    padding-bottom: 18px;
    margin-bottom: 28px;
    flex-wrap: wrap;
  }

  .brand h1 {
    font-size: 34px;
    line-height: 1;
  }
  .brand p {
    margin: 8px 0 0;
    color: var(--ink-soft);
    font-size: 14.5px;
    max-width: 42ch;
  }

  .top-controls {
    display: flex;
    gap: 10px;
    align-items: center;
    flex-wrap: wrap;
  }

  .search-wrap {
    position: relative;
  }
  .search-wrap input[type="text"] {
    background: var(--paper-card);
    border: 1.5px solid var(--line);
    border-radius: 3px;
    padding: 9px 12px 9px 32px;
    font-size: 14px;
    color: var(--ink);
    width: 220px;
    outline: none;
    transition: border-color .15s ease;
  }
  .search-wrap input[type="text"]:focus {
    border-color: var(--ink);
  }
  .search-wrap svg {
    position: absolute;
    left: 10px;
    top: 50%;
    transform: translateY(-50%);
    width: 14px;
    height: 14px;
    opacity: .55;
  }

  .btn {
    border: 1.5px solid var(--ink);
    background: var(--ink);
    color: var(--paper-card);
    padding: 9px 16px;
    border-radius: 3px;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    transition: transform .1s ease, background .15s ease;
  }
  .btn:hover { background: #423a2c; }
  .btn:active { transform: translateY(1px); }
  .btn.ghost {
    background: transparent;
    color: var(--ink);
  }
  .btn.ghost:hover { background: rgba(42,36,28,.06); }

  #file-input { display: none; }

  .banner {
    display: none;
    background: #F4E3DA;
    border: 1.5px solid var(--rust);
    color: #6b2c14;
    padding: 10px 14px;
    border-radius: 3px;
    font-size: 13.5px;
    margin-bottom: 20px;
  }
  .banner.show { display: block; }

  /* ---------- two column body ---------- */
  .body-grid {
    display: grid;
    grid-template-columns: 280px 1fr;
    gap: 32px;
    align-items: start;
  }

  .index {
    position: sticky;
    top: 24px;
  }

  .cat-block { margin-bottom: 22px; }

  .cat-tab {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-family: 'Fraunces', serif;
    font-size: 15px;
    font-weight: 600;
    padding: 3px 10px 3px 0;
    margin-bottom: 8px;
    color: var(--ink);
    border-bottom: 2px solid currentColor;
  }
  .cat-tab .dot {
    width: 9px; height: 9px;
    border-radius: 50%;
    background: currentColor;
    flex-shrink: 0;
  }
  .cat-count {
    font-family: 'Inter', sans-serif;
    font-weight: 500;
    font-size: 12px;
    color: var(--ink-soft);
  }

  .recipe-link {
    display: block;
    width: 100%;
    text-align: left;
    background: none;
    border: none;
    padding: 7px 10px 7px 12px;
    font-size: 14.5px;
    color: var(--ink-soft);
    cursor: pointer;
    border-left: 2px solid transparent;
    border-radius: 0 3px 3px 0;
    line-height: 1.35;
  }
  .recipe-link:hover {
    background: rgba(42,36,28,.05);
    color: var(--ink);
  }
  .recipe-link.active {
    background: var(--paper-card);
    color: var(--ink);
    font-weight: 600;
    border-left: 2px solid var(--ink);
  }
  .recipe-link .sub {
    display: block;
    font-weight: 400;
    font-size: 12px;
    color: var(--ink-soft);
    margin-top: 1px;
  }

  .empty-note {
    font-size: 13px;
    color: var(--ink-soft);
    font-style: italic;
    padding: 4px 0 4px 12px;
  }

  /* ---------- detail card ---------- */
  .card {
    background: var(--paper-card);
    border: 1.5px solid var(--line);
    border-radius: 4px;
    padding: 36px 40px;
    box-shadow: 3px 3px 0 rgba(42,36,28,.05);
    min-height: 420px;
  }

  .placeholder {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    justify-content: center;
    height: 380px;
    color: var(--ink-soft);
  }
  .placeholder .display { font-size: 24px; color: var(--ink); margin-bottom: 8px; }
  .placeholder p { max-width: 40ch; font-size: 14.5px; line-height: 1.5; }

  .recipe-head {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 20px;
    border-bottom: 1.5px solid var(--line);
    padding-bottom: 20px;
    margin-bottom: 22px;
  }
  .recipe-title { font-size: 30px; line-height: 1.15; max-width: 32ch; }
  .recipe-cat {
    font-size: 13px;
    color: var(--cat-color, var(--ink-soft));
    margin-top: 6px;
    font-weight: 600;
  }

  .meta-row {
    display: flex;
    gap: 22px;
    flex-wrap: wrap;
    margin-bottom: 4px;
  }
  .meta-item {
    font-size: 13px;
    color: var(--ink-soft);
  }
  .meta-item b { color: var(--ink); font-weight: 600; }

  .tag-row {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    margin-top: 14px;
  }
  .tag {
    font-size: 11.5px;
    padding: 3px 9px;
    border-radius: 20px;
    border: 1px solid var(--line);
    color: var(--ink-soft);
  }

  .content-grid {
    display: grid;
    grid-template-columns: 220px 1fr;
    gap: 40px;
  }

  .section-label {
    font-family: 'Fraunces', serif;
    font-style: italic;
    font-size: 16px;
    color: var(--ink);
    margin-bottom: 12px;
  }

  ul.ingredients { list-style: none; margin: 0; padding: 0; }
  ul.ingredients li {
    display: flex;
    gap: 10px;
    font-size: 14px;
    padding: 6px 0;
    border-bottom: 1px dashed var(--line);
    cursor: default;
  }
  ul.ingredients li:last-child { border-bottom: none; }
  ul.ingredients li .qty {
    flex-shrink: 0;
    min-width: 62px;
    color: var(--ink-soft);
    font-weight: 500;
  }
  ul.ingredients li.checked .item { text-decoration: line-through; color: var(--ink-soft); }
  ul.ingredients li input {
    accent-color: var(--sage);
    margin-top: 2px;
  }

  ol.steps { margin: 0; padding: 0; list-style: none; counter-reset: step; }
  ol.steps li {
    counter-increment: step;
    display: grid;
    grid-template-columns: 26px 1fr;
    gap: 14px;
    font-size: 14.5px;
    line-height: 1.6;
    margin-bottom: 16px;
  }
  ol.steps li::before {
    content: counter(step);
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 15px;
    color: var(--cat-color, var(--ink));
  }

  .note-box {
    margin-top: 26px;
    padding: 14px 16px;
    background: rgba(110,127,92,.08);
    border-left: 3px solid var(--sage);
    font-size: 13.5px;
    color: var(--ink-soft);
    border-radius: 0 3px 3px 0;
  }

  .source-toggle {
    margin-top: 28px;
    border-top: 1.5px solid var(--line);
    padding-top: 16px;
  }
  .source-toggle button {
    background: none;
    border: none;
    padding: 0;
    color: var(--ink-soft);
    font-size: 12.5px;
    cursor: pointer;
    text-decoration: underline;
    text-underline-offset: 3px;
  }
  .source-toggle button:hover { color: var(--ink); }
  .yaml-view {
    display: none;
    margin-top: 12px;
    background: var(--ink);
    color: #E9DFC8;
    padding: 16px 18px;
    border-radius: 4px;
    font-size: 12.5px;
    line-height: 1.6;
    overflow-x: auto;
    white-space: pre;
  }
  .yaml-view.show { display: block; }

  footer {
    margin-top: 40px;
    text-align: center;
    font-size: 12.5px;
    color: var(--ink-soft);
  }

  @media (max-width: 820px) {
    .body-grid { grid-template-columns: 1fr; }
    .index {
      position: static;
      display: flex;
      overflow-x: auto;
      gap: 20px;
      padding-bottom: 10px;
      border-bottom: 1.5px solid var(--line);
      margin-bottom: 24px;
    }
    .cat-block { margin-bottom: 0; flex-shrink: 0; min-width: 190px; }
    .card { padding: 26px 22px; }
    .content-grid { grid-template-columns: 1fr; gap: 26px; }
    .recipe-title { font-size: 25px; }
  }
</style>
</head>
<body>

<div class="shell">

  <header class="top">
    <div class="brand">
      <h1>The Recipe Box</h1>
      <p>A small card catalog of recipes, each one kept as a plain YAML file underneath.</p>
    </div>
    <div class="top-controls">
      <div class="search-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="text" id="search" placeholder="Search recipes or ingredients">
      </div>
      <button class="btn" id="add-btn">Add YAML files</button>
      <input type="file" id="file-input" accept=".yaml,.yml,text/yaml,text/plain" multiple>
    </div>
  </header>

  <div class="banner" id="banner"></div>

  <div class="body-grid">
    <nav class="index" id="index"></nav>
    <main class="card" id="detail"></main>
  </div>

  <footer>Drop in your own <code>.yaml</code> recipe files to add them to the box &mdash; nothing leaves your browser.</footer>

</div>

<script>
// ---------- sample recipes, stored as raw YAML text (as if each were its own file) ----------
const FILES = ["PeaPasta.yaml"];
const CATEGORY_ORDER = ["Morning", "Midday", "Evening", "Sweet"];
const CATEGORY_COLOR = {
  Morning: "var(--mustard)",
  Midday: "var(--sage)",
  Evening: "var(--rust)",
  Sweet: "var(--plum)"
};
const FALLBACK_COLORS = ["var(--mustard)", "var(--sage)", "var(--rust)", "var(--plum)"];

let recipes = [];   // { id, title, category, time, servings, tags, ingredients, steps, note, raw }
let activeId = null;
let idCounter = 0;

function colorForCategory(cat) {
  if (CATEGORY_COLOR[cat]) return CATEGORY_COLOR[cat];
  const idx = Math.abs(hashCode(cat)) % FALLBACK_COLORS.length;
  return FALLBACK_COLORS[idx];
}
function hashCode(str) {
  let h = 0;
  for (let i = 0; i < str.length; i++) h = (h << 5) - h + str.charCodeAt(i) | 0;
  return h;
}

function parseIngredient(raw) {
  // supports "qty: item" strings, or plain strings
  const idx = raw.indexOf(":");
  if (idx > -1 && idx < 18) {
    return { qty: raw.slice(0, idx).trim(), item: raw.slice(idx + 1).trim() };
  }
  return { qty: "", item: raw.trim() };
}

function loadFromYaml(text, sourceLabel) {
  const data = jsyaml.load(text);
  if (!data || !data.title) throw new Error(`Missing "title" field${sourceLabel ? " in " + sourceLabel : ""}`);
  const id = "r" + (idCounter++);
  recipes.push({
    id,
    title: String(data.title),
    category: data.category ? String(data.category) : "Uncategorized",
    time: data.time || "",
    servings: data.servings || "",
    tags: Array.isArray(data.tags) ? data.tags : [],
    ingredients: Array.isArray(data.ingredients) ? data.ingredients.map(parseIngredient) : [],
    steps: Array.isArray(data.steps) ? data.steps : [],
    note: data.note || "",
    raw: text.trim()
  });
  return id;
}

function showBanner(msg) {
  const b = document.getElementById("banner");
  b.textContent = msg;
  b.classList.add("show");
  clearTimeout(showBanner._t);
  showBanner._t = setTimeout(() => b.classList.remove("show"), 5000);
}

function groupedRecipes(filterText) {
  const q = (filterText || "").trim().toLowerCase();
  const groups = {};
  recipes.forEach(r => {
    if (q) {
      const hay = [r.title, r.category, ...r.tags, ...r.ingredients.map(i => i.item)].join(" ").toLowerCase();
      if (!hay.includes(q)) return;
    }
    if (!groups[r.category]) groups[r.category] = [];
    groups[r.category].push(r);
  });
  // order known categories first, then any extras alphabetically
  const known = CATEGORY_ORDER.filter(c => groups[c]);
  const extra = Object.keys(groups).filter(c => !CATEGORY_ORDER.includes(c)).sort();
  return [...known, ...extra].map(cat => ({ cat, items: groups[cat] }));
}

function renderIndex() {
  const nav = document.getElementById("index");
  const q = document.getElementById("search").value;
  const groups = groupedRecipes(q);

  if (groups.length === 0) {
    nav.innerHTML = `<div class="empty-note">No recipes match "${escapeHtml(q)}".</div>`;
    return;
  }

  nav.innerHTML = groups.map(({ cat, items }) => {
    const color = colorForCategory(cat);
    const links = items.map(r => `
      <button class="recipe-link ${r.id === activeId ? "active" : ""}" data-id="${r.id}">
        ${escapeHtml(r.title)}
        <span class="sub">${[r.time, r.servings ? (r.servings + (typeof r.servings === "number" ? " servings" : "")) : ""].filter(Boolean).join(" · ")}</span>
      </button>`).join("");
    return `
      <div class="cat-block">
        <div class="cat-tab" style="color:${color}">
          <span class="dot"></span>${escapeHtml(cat)}
          <span class="cat-count">${items.length}</span>
        </div>
        ${links}
      </div>`;
  }).join("");

  nav.querySelectorAll(".recipe-link").forEach(btn => {
    btn.addEventListener("click", () => {
      activeId = btn.dataset.id;
      renderIndex();
      renderDetail();
    });
  });
}

function renderDetail() {
  const detail = document.getElementById("detail");
  const r = recipes.find(x => x.id === activeId);

  if (!r) {
    detail.innerHTML = `
      <div class="placeholder">
        <div class="display">Pick a card to start cooking</div>
        <p>Choose a recipe from the index on the left, or add your own YAML files with the button above.</p>
      </div>`;
    return;
  }

  const color = colorForCategory(r.category);
  const metaBits = [];
  if (r.time) metaBits.push(`<span class="meta-item"><b>${escapeHtml(String(r.time))}</b> total</span>`);
  if (r.servings) metaBits.push(`<span class="meta-item"><b>${escapeHtml(String(r.servings))}</b> servings</span>`);

  detail.style.setProperty("--cat-color", color);
  detail.innerHTML = `
    <div class="recipe-head">
      <div>
        <h2 class="recipe-title">${escapeHtml(r.title)}</h2>
        <div class="recipe-cat">${escapeHtml(r.category)}</div>
      </div>
    </div>

    <div class="meta-row">${metaBits.join("")}</div>
    ${r.tags.length ? `<div class="tag-row">${r.tags.map(t => `<span class="tag">${escapeHtml(t)}</span>`).join("")}</div>` : ""}

    <div class="content-grid" style="margin-top:26px;">
      <div>
        <div class="section-label">Ingredients</div>
        <ul class="ingredients">
          ${r.ingredients.map((ing, i) => `
            <li data-i="${i}">
              <input type="checkbox">
              <span class="qty">${escapeHtml(ing.qty)}</span>
              <span class="item">${escapeHtml(ing.item)}</span>
            </li>`).join("")}
        </ul>
      </div>
      <div>
        <div class="section-label">Steps</div>
        <ol class="steps">
          ${r.steps.map(s => `<li>${escapeHtml(s)}</li>`).join("")}
        </ol>
        ${r.note ? `<div class="note-box">${escapeHtml(r.note)}</div>` : ""}
      </div>
    </div>

    <div class="source-toggle">
      <button id="toggle-yaml">View the YAML source</button>
      <pre class="yaml-view" id="yaml-view">${escapeHtml(r.raw)}</pre>
    </div>
  `;

  detail.querySelectorAll(".ingredients li").forEach(li => {
    li.addEventListener("click", (e) => {
      if (e.target.tagName !== "INPUT") {
        const cb = li.querySelector("input");
        cb.checked = !cb.checked;
      }
      li.classList.toggle("checked", li.querySelector("input").checked);
    });
  });

  const toggleBtn = document.getElementById("toggle-yaml");
  const yamlView = document.getElementById("yaml-view");
  toggleBtn.addEventListener("click", () => {
    const showing = yamlView.classList.toggle("show");
    toggleBtn.textContent = showing ? "Hide the YAML source" : "View the YAML source";
  });
}

function escapeHtml(str) {
  return String(str)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}

// ---------- init ----------
async function init() {

  for (const file of FILES) {
    try {
      res = await fetch(file);
      yamlText = await res.text();
      loadFromYaml(yamlText, `sample recipe`);
    } catch (e) {
      console.error(e);
    }
  }

  //FILES.forEach((text, i) => {
   //     res = await fetch(text);
  //});
  //response = await fetch('PeaPasta.yaml');
  //yamlText = await response.text();

  //loadFromYaml(yamlText, `file recipe`);

  if (recipes.length) activeId = recipes[0].id;
  renderIndex();
  renderDetail();
}

document.getElementById("search").addEventListener("input", renderIndex);

document.getElementById("add-btn").addEventListener("click", () => {
  document.getElementById("file-input").click();
});

document.getElementById("file-input").addEventListener("change", async (e) => {
  const files = Array.from(e.target.files || []);
  let added = 0;
  const errors = [];
  for (const file of files) {
    try {
      const text = await file.text();
      const id = loadFromYaml(text, file.name);
      added++;
      activeId = id;
    } catch (err) {
      errors.push(`${file.name}: ${err.message}`);
    }
  }
  if (added) {
    renderIndex();
    renderDetail();
    showBanner(`Added ${added} recipe${added === 1 ? "" : "s"}.` + (errors.length ? ` ${errors.length} failed to parse.` : ""));
  } else if (errors.length) {
    showBanner(`Couldn't parse: ${errors.join("; ")}`);
  }
  e.target.value = "";
});

init();
</script>
</body>
</html>
